name: Python Application

on: 
  push:
  pull_request:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"

      - name: Run Application
        run: python app.py